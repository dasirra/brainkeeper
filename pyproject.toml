[project]
name = "brainkeeper"
version = "0.2.0"
description = "Structured Markdown vault standard with a Python vault engine and MCP interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Daniel Sierra", email = "dasirra@gmail.com" }]
keywords = ["second-brain", "pkm", "obsidian", "mcp", "markdown", "vault", "para"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/dasirra/brainkeeper"
Repository = "https://github.com/dasirra/brainkeeper"
Changelog = "https://github.com/dasirra/brainkeeper/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/dasirra/brainkeeper/issues"

[project.scripts]
brainkeeper = "brainkeeper.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainkeeper"]

[tool.hatch.build.targets.wheel.force-include]
"spec/schema" = "src/brainkeeper/spec/schema"
"spec/SPEC.md" = "src/brainkeeper/spec/SPEC.md"
"spec/examples" = "src/brainkeeper/spec/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
