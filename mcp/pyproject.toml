[project]
name = "brainkeeper-mcp"
version = "0.1.0a0"
description = "MCP server enforcing the brainkeeper spec on a Markdown vault"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Daniel Sierra" }]
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "jsonschema>=4.21",
]

[project.scripts]
brainkeeper-mcp = "brainkeeper_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainkeeper_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
