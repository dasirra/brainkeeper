# Zettelkasten-style vault. Custom folder names.
# Proves the spec does not hardcode English or numeric prefixes.

layers:
  inbox: "Fleeting"
  journal:
    path:   "Daily"
    format: "YYYY-MM-DD.md"
  projects: "Projects"
  areas:    "Permanent"
  brain:    "Literature"
  archive:
    path: "Archive"
    year_subfolder: true

capture_routing:
  idea:    "Fleeting/Ideas.md"
  default: "Fleeting/"
